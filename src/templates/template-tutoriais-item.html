<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tecnologias no Diabetes - Tutoriais</title>
    <link rel="icon" type="image/png" href="./img/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./img/favicon.svg" />
    <link rel="shortcut ícon" href="./img/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./img/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Tecnologias no Diabetes" />
    <link rel="manifest" href="./img/site.webmanifest" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/geral.css">
</head>

<body id="body-tutorials-item">
    {{> view-counter }}
    <div class="container" id="main-container-tutorials-item"><br>
        {{> menu }}
        <a class="return-index" id="return-tutorials" href="tutoriais.html">Retornar</a>
        {{> notificacoes }}

        <div class="hero tutoriais" id="hero-section-tutorials-item">
            <h1 id="tutorials-item-title">{{this.title}}</h1>
            <p id="tutorials-item-description">{{this.desc}}</p>
        </div>

        <section id="section-tutorials-item">
            <div class="category-content" id="content-tutorials">
                {{> search-bar }}
                <ul id="tutorials-item-list">
                    {{#each links}}
                    <li class="tutorials-item-list-item links">
                        <span class="tutorials-item-link-title">{{this.title}}</span>
                        <div class="buttons" id="tutorials-item-buttons-{{@index}}">
                            <button data-cy="access" id="btn-access-{{@index}}" onclick="window.open('{{this.fullUrl}}', '_blank')">Acessar</button>
                            <button data-cy="copy" id="btn-copy-{{@index}}" onclick="copyLink('{{this.newLink}}', this)">Copiar Link</button>
                        </div>
                    </li>
                    {{/each}}
                </ul>
            </div>
        </section>
    </div>
    {{> social-media }}
    {{> footer }}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        window.env = {
            API_BASE_URL: "{{apiBaseUrl}}",
            API_KEY: "{{apiKey}}",
            MOST_RECENT_NOTIFICATION_ID: "{{mostRecentNotificationId}}",
        };
    </script>
    <script src="./js/geral.js"></script>
    <script src="./js/barra-pesquisa.js"></script>
</body>
</html>
