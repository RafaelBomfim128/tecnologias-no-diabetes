<script>
function toggleMobileMenu(evt) {
    if (evt) {
        evt.preventDefault();
        evt.stopPropagation();
    }
    const mobileMenu = document.getElementById('mobile-menu');
    const menuIcon = document.getElementById('menu-icon');
    
    if (mobileMenu.classList.contains('hidden')) {
        mobileMenu.classList.remove('hidden');
        // Mudar ícone para X
        menuIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>';
    } else {
        mobileMenu.classList.add('hidden');
        // Mudar ícone para hamburger
        menuIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>';
    }
}

document.addEventListener('DOMContentLoaded', function() {
    const mobileMenuLinks = document.querySelectorAll('#mobile-menu a');
    mobileMenuLinks.forEach(link => {
        link.addEventListener('click', function() {
            const mobileMenu = document.getElementById('mobile-menu');
            const menuIcon = document.getElementById('menu-icon');
            if (mobileMenu && !mobileMenu.classList.contains('hidden')) {
                mobileMenu.classList.add('hidden');
                menuIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>';
            }
        });
    });
    
    document.addEventListener('click', function(e) {
        const mobileMenu = document.getElementById('mobile-menu');
        const menuBtn = document.getElementById('mobile-menu-btn');
        const menuIcon = document.getElementById('menu-icon');
        if (!mobileMenu) return;
        const isOpen = !mobileMenu.classList.contains('hidden');
        if (!isOpen) return;

        const clickInsideMenu = e.target.closest('#mobile-menu') !== null;
        const clickOnButton = e.target.closest('#mobile-menu-btn') !== null;

        if (!clickInsideMenu && !clickOnButton) {
            mobileMenu.classList.add('hidden');
            if (menuIcon) {
                menuIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>';
            }
        }
    });

    const currentPage = window.location.pathname.split('/').pop() || 'index.html';
    document.querySelectorAll('.nav-link').forEach(link => {
        if (link.getAttribute('href') === currentPage) {
            link.classList.add('nav-link-active');
        }
    });

    try {
        const desktopIndicator = document.getElementById('notification-indicator');
        const mobileIndicator = document.getElementById('mobile-notification-indicator');
        const desktopLink = document.getElementById('desktop-menu-notifications');
        const mobileLink = document.getElementById('mobile-menu-notifications');

        const mostRecentNotificationId = window.env && window.env.MOST_RECENT_NOTIFICATION_ID;
        const lastViewedNotificationId = localStorage.getItem('lastViewedNotification');
        const hasUnread = Boolean(mostRecentNotificationId) && (!lastViewedNotificationId || lastViewedNotificationId !== mostRecentNotificationId);

        const setIndicator = (visible) => {
            if (desktopIndicator) desktopIndicator.classList.toggle('hidden', !visible);
            if (mobileIndicator) mobileIndicator.classList.toggle('hidden', !visible);
        };

        setIndicator(hasUnread);

        const markAsRead = () => {
            if (!mostRecentNotificationId) return;
            localStorage.setItem('lastViewedNotification', mostRecentNotificationId);
            setIndicator(false);
        };

        if (desktopLink) desktopLink.addEventListener('click', markAsRead);
        if (mobileLink) mobileLink.addEventListener('click', markAsRead);
    } catch (e) {
        console.debug('Avisos indicator setup skipped:', e);
    }

    try {
        const nav = document.getElementById('main-nav');
        const viewCounter = document.getElementById('view-counter');
        if (nav) {
            const BASE_MARGIN = 10;
            const EXTRA_MARGIN = 0;

            const calcMarginTop = () => {
                if (!viewCounter) return `${BASE_MARGIN}px`;
                const rect = viewCounter.getBoundingClientRect();
                const visibleBottom = Math.max(0, rect.bottom);
                const target = Math.max(BASE_MARGIN, Math.ceil(visibleBottom + EXTRA_MARGIN));
                return `${target}px`;
            };

            const applyMargin = () => {
                const next = calcMarginTop();
                if (nav.style.marginTop !== next) nav.style.marginTop = next;
            };

            if (viewCounter && 'ResizeObserver' in window) {
                const ro = new ResizeObserver(applyMargin);
                ro.observe(viewCounter);
            }
            window.addEventListener('scroll', applyMargin, { passive: true });
            window.addEventListener('resize', applyMargin);
            applyMargin();
        }
    } catch (e) {
        // no-op
    }
});
</script>
