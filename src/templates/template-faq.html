<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tecnologias no Diabetes - FAQ - Perguntas Frequentes</title>
    <link rel="icon" type="image/png" href="./img/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./img/favicon.svg" />
    <link rel="shortcut icon" href="./img/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./img/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Tecnologias no Diabetes" />
    <link rel="manifest" href="./img/site.webmanifest" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/geral.css">
    <link rel="stylesheet" href="./css/faq.css">
</head>

<body id="body-faq">
    {{> view-counter }}
    <div class="container" id="main-container-faq"><br>
        {{> menu }}
        <a class="return-index" id="return-faq" href="index.html">Retornar</a>
        {{> notificacoes }}

        <div class="hero faq" id="hero-section-faq">
            <h1 id="faq-main-title">FAQ - Perguntas Frequentes ❓💡</h1>
            <p id="faq-main-description">Encontre aqui as respostas para as perguntas mais frequentes sobre diabetes e tecnologias.</p>
        </div>

        <section id="section-faq">
            {{> search-bar }}
            <div class="faq" id="faq-list">
                {{#each questionAnswer}}
                <div class="faq-item" data-cy="faq-item" id="faq-item-{{this.id}}" data-id="{{this.id}}">
                    <button data-cy="faq-question" class="faq-question" id="faq-question-{{this.id}}">
                        {{this.question}}
                        <span class="arrow" id="faq-arrow-{{this.id}}"></span>
                    </button>
                    <div data-cy="faq-answer" class="faq-answer" id="faq-answer-{{this.id}}">
                        <a data-cy="faq-link-share" href="#" target="_blank" class="share-icon whatsapp" id="faq-share-btn-whatsapp-{{this.id}}">
                            <img data-cy="faq-img-link-share" id="whatsapp-icon-{{this.id}}" src="./img/whatsapp-icon.png" alt="Ícone de compartilhar no Whatsapp" />
                        </a>
                        {{{this.answer}}}
                    </div>
                </div>
                {{/each}}
            </div>
        </section>
    </div>
    {{> social-media }}
    {{> footer }}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        window.env = {
            API_BASE_URL: "{{apiBaseUrl}}",
            API_KEY: "{{apiKey}}",
            MOST_RECENT_NOTIFICATION_ID: "{{mostRecentNotificationId}}",
        };
    </script>
    <script src="./js/geral.js"></script>
    <script src="./js/faq.js"></script>
    <script src="./js/barra-pesquisa.js"></script>
</body>

</html>
